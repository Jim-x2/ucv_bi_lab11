
services:
  floci:
    image: floci/floci:latest
    container_name: ucv-floci
    ports:
      - "4566:4566"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  glue5:
    image: public.ecr.aws/glue/aws-glue-libs:5
    container_name: ucv-glue5
    depends_on:
      - floci
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SPARK_EXTRA_CLASSPATH: /usr/share/aws/iceberg/lib/iceberg-spark-runtime-3.5_2.12-1.7.1-amzn-1.jar
    volumes:
      - ./pipelines:/home/hadoop/workspace/pipelines
    working_dir: /home/hadoop/workspace
    entrypoint: ["/bin/bash", "-lc"]
    command: ["tail -f /dev/null"]
